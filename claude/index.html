<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Widget Host</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --fg: #1c1c1e;
      --muted: #5f6470;
      --card: #ffffff;
      --border: #e2e4e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }

    p.muted {
      color: var(--muted);
      margin-bottom: 0;
    }
  </style>
  <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">
</head>
<body>
  <header>
    <h1>Chat Widget Host</h1>
  </header>

  <main>
    <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/730203370395/locations/eu/apps/977d1fe7-5ae5-48fc-84ac-68d0b5cac661/deployments/111375c3-be6e-404b-8f47-65e4de8a7526",
          tokenBroker: {
            enableTokenBroker: true,
            enableRecaptcha: false
          }
        }),
      );
    });
</script>
<!-- Update the url-allowlist attribute with a comma-separated list of origins allowed to render images -->
<chat-messenger
  url-allowlist="*"
>
  <chat-messenger-container
    chat-title="This one is for Mum!"
    chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
    enable-file-upload
    enable-audio-input
  >
    <chat-reset-session-button
      slot="titlebar-actions"
      title-text="Start new chat"
    ></chat-reset-session-button>
    <chat-toggle-dialog-button
      slot="titlebar-actions"
      title-text-expanded="Collapse"
      title-text-collapsed="Expand"
    ></chat-toggle-dialog-button>
    <chat-messenger-close-button
      slot="titlebar-actions"
      title-text="Close"
    ></chat-messenger-close-button>
  </chat-messenger-container>
</chat-messenger>
  </main>

  <!-- ===== Chat widget goes here ===== -->

</body>
</html>
